{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Konfly{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    {% block css_files %}{% endblock %}
</head>

<body class="min-h-screen overflow-x-hidden bg-[#12051F] text-white relative"
      style="font-family:'Poppins',sans-serif;">

    <!-- Background -->
    <div class="fixed inset-0 -z-10">
        <img src="{% static 'theme/heroImage.jpeg' %}"
             alt=""
             class="h-full w-full object-cover object-center">

        <div class="absolute inset-0 bg-[#12051F]/50"></div>

        <div class="absolute inset-0 bg-gradient-to-b from-[#12051F]/10 via-[#12051F]/35 to-[#12051F]"></div>
    </div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-violet-500/20 bg-[#12051F]/25 backdrop-blur-lg">

    <div class="flex h-16 w-full items-center justify-between px-4 md:px-8 lg:px-10">

        <!-- Logo -->
        <a href="/"
           class="text-[34px] tracking-[0.25em] text-[#FFF15C]"
           style="font-family:'Silkscreen', monospace;">
            KONFLY
        </a>

        <!-- Links -->
        <div class="flex items-center gap-8 text-sm font-medium">

            <a href="/explore" class="text-white/70 transition hover:text-[#FFF15C]">
                Explore
            </a>

            <a href="#" class="text-white/70 transition hover:text-[#FFF15C]">
                Host
            </a>

            <a href="#"
               class="rounded-full border border-[#FFF15C]/40 px-4 py-1.5 text-[#FFF15C] transition hover:bg-[#FFF15C] hover:text-[#12051F]">
                Login
            </a>

        </div>

    </div>

</nav>

    <!-- Main Content -->
    <main class="mx-auto w-full max-w-screen-2xl px-4 sm:px-6 lg:px-8 py-8">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer class="border-t border-violet-500/20 bg-black/20 backdrop-blur-md">

        <div class="mx-auto flex w-full max-w-screen-2xl flex-col items-center justify-between px-4 py-8 text-sm sm:px-6 md:flex-row lg:px-8">

            <p class="text-white/40">
                © 2026 Konfly — Events Near You.
            </p>

            <div class="mt-4 flex gap-6 text-white/50 md:mt-0">

                <a href="#" class="transition hover:text-[#FFF15C]">
                    GitHub
                </a>

                <a href="#" class="transition hover:text-[#FFF15C]">
                    Contact
                </a>

                <a href="#" class="transition hover:text-[#FFF15C]">
                    About
                </a>

            </div>

        </div>

    </footer>

</body>
</html>
