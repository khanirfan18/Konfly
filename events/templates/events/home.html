{% extends "base.html" %}
{% load static %}

{% block title %}Konfly{% endblock %}

{% block content %}

{% if events %}

<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-12">

    {% for event in events %}

    <a href="#" class="group block">

        <article class="overflow-hidden rounded-sm border border-white/5 bg-[#170728]/55 backdrop-blur-md transition-all duration-300 hover:border-[#FFF15C] hover:bg-[#170728]/70">

            <div class="aspect-[16/9] overflow-hidden">

                <img src="{{ event.banner.url }}"
                     alt="{{ event.title }}"
                     class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]">

            </div>

            <div class="px-6 py-6">

                <h3 class="text-2xl font-bold leading-8 text-[#FFF15C]">
                    {{ event.title }}
                </h3>

                <p class="mt-4 flex items-center gap-2 text-base tracking-wide text-white/65">

                    <span class="text-[#FFF15C]">📍</span>

                    {{ event.location }}

                </p>

            </div>

        </article>

    </a>

    {% endfor %}

</div>

{% else %}

<div class="py-28 text-center text-lg text-white/50">
    No events available yet.
</div>

{% endif %}

{% endblock %}
